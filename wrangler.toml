name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"
# 이 워커를 다시 배포해도 대시보드에 등록된 값(비밀키 포함)을 지우지 않는다.
# 2026-09-07: ALLOWED_DOMAINS 를 고쳐 배포했더니 GITHUB_CLIENT_SECRET 이 무효화돼
#             두 사이트의 /admin 로그인이 모두 막혔다. 그 재발을 막기 위한 설정.
keep_vars = true

# NURSphere Lab / Bright Kyrgyzstan 두 사이트의 관리자 로그인을 함께 처리한다.
# GITHUB_CLIENT_SECRET 은 비밀값이므로 여기에 넣지 않고
# `wrangler secret put GITHUB_CLIENT_SECRET` 으로 별도 등록한다.
# ALLOWED_DOMAINS 에는 /admin 을 여는 주소를 전부 적어야 한다 (쉼표 구분).
[vars]
GITHUB_CLIENT_ID = "Ov23limmW0DITyCPrRQf"
ALLOWED_DOMAINS = "nursphere.hyunmh3.workers.dev,brightkyr.hyunmh3.workers.dev,healthcaresimulation.khu.ac.kr,brightkyr.khu.ac.kr,localhost"